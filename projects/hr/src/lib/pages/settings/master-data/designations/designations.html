<div class="page-container">
  <div class="inv-hero">
    <div class="inv-hero-titles">
      <div class="inv-hero-mark"><span class="material-symbols-outlined">badge</span></div>
      <div>
        <h1>Designations</h1>
        <p class="inv-hero-sub">Manage job designations</p>
      </div>
    </div>
    <div class="inv-hero-actions">
      <button class="btn-brand" (click)="openCreateForm()"><span class="material-symbols-outlined">add</span> New Designation</button>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div class="md-split">
    <div class="md-list">
      <div class="md-list-body">
        <ng-container *ngIf="loading">
          <div class="md-rec" *ngFor="let s of [0,1,2,3]"><span class="skeleton sk-circle" style="width:34px;height:34px"></span><div style="flex:1"><span class="skeleton sk-line" style="width:70%"></span></div></div>
        </ng-container>
        <div *ngIf="!loading && designations.length === 0" class="inv-empty" style="padding:36px 16px"><div class="inv-empty-icon"><span class="material-symbols-outlined">badge</span></div><div class="inv-empty-title">No designations</div><div class="inv-empty-text">Create your first designation.</div></div>
        <button class="md-rec" *ngFor="let desig of designations" [class.selected]="editingDesignation?.id === desig.id" (click)="openEditForm(desig)">
          <span class="md-rec-ico">{{ (desig.designationName || '?').charAt(0) }}</span>
          <div class="md-rec-main"><span class="md-rec-title">{{ desig.designationName }}</span><span class="md-rec-sub"><span class="md-rec-code">{{ desig.designationCode }}</span></span></div>
          <span class="md-rec-status" [class.on]="desig.isActive" [class.off]="!desig.isActive"></span>
        </button>
      </div>
    </div>

    <div class="md-detail">
      <ng-container *ngIf="showForm; else desigEmpty">
        <div class="md-detail-head">
          <span class="md-detail-title">{{ editingDesignation ? 'Edit Designation' : 'New Designation' }}</span>
          <button class="icon-btn" title="Close" (click)="cancelForm()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="md-detail-body">
          <form (ngSubmit)="saveDesignation()">
            <div class="form-grid">
              <div class="form-group"><label>Designation Name *</label><input type="text" [(ngModel)]="formDesignationName" name="designationName" required /></div>
              <div class="form-group"><label>Designation Code</label><input type="text" [(ngModel)]="formDesignationCode" name="designationCode" /></div>
            </div>
            <div class="form-actions">
              <button type="button" class="ibtn ibtn--danger" style="margin-right:auto" *ngIf="editingDesignation" (click)="deleteDesignation(editingDesignation)"><span class="material-symbols-outlined">delete</span> Delete</button>
              <button type="button" (click)="cancelForm()" class="ibtn ibtn--secondary">Cancel</button>
              <button type="submit" class="ibtn ibtn--primary"><span class="material-symbols-outlined">save</span> {{ editingDesignation ? 'Update' : 'Create' }}</button>
            </div>
          </form>
        </div>
      </ng-container>
      <ng-template #desigEmpty>
        <div class="md-empty">
          <div class="md-empty-icon"><span class="material-symbols-outlined">badge</span></div>
          <div class="md-empty-title">Manage designations</div>
          <div class="md-empty-text">Select a designation to edit, or create a new one.</div>
          <button class="btn-brand" style="margin-top:8px" (click)="openCreateForm()"><span class="material-symbols-outlined">add</span> New Designation</button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
