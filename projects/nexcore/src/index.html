<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NexCore-erp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/images/nexcore-mark.svg">
  <!-- PWA: installable on the local system -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="/icons/app-icon.svg">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <script>
    // Paint the saved theme before Angular boots, so the first frame is already the
    // right colour instead of flashing the default. ThemeService re-applies (and
    // migrates legacy names) once it starts — this only avoids the flash.
    (function () {
      var DEFAULT = 'theme-graphite';
      var MAP = {
        Light: '', Graphite: 'theme-graphite', Slate: 'theme-slate',
        Carbon: 'theme-carbon', Obsidian: 'theme-obsidian', Sepia: 'theme-sepia',
        Dark: 'theme-carbon', Midnight: 'theme-slate'   /* legacy names */
      };
      try {
        var saved = localStorage.getItem('ui_theme');
        var cls = saved == null ? DEFAULT : MAP[saved];
        if (cls === undefined) cls = DEFAULT;
        if (cls) document.body.className = cls;
      } catch (e) { document.body.className = DEFAULT; }
    })();
  </script>
  <app-root></app-root>
  <script>
    // Stash the browser's install prompt so the in-app "Install app" button can fire it later.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      window.dispatchEvent(new Event('pwa-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__deferredInstallPrompt = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });
    // Register the service worker (required for installability). Localhost counts as a secure context.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () { /* non-fatal */ });
      });
    }
  </script>
</body>
</html>
