<div class="ai-backdrop" [class.show]="open" (click)="onClose()"></div>

<aside class="ai-drawer" [class.open]="open" role="dialog" aria-label="NexCore AI Assistant">
  <header class="ai-head">
    <div class="ai-head-id">
      <span class="ai-spark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"></path>
          <path d="M19 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"></path>
        </svg>
      </span>
      <div class="ai-head-text">
        <div class="ai-title">NexCore AI</div>
        <div class="ai-sub">Your intelligent assistant</div>
      </div>
    </div>
    <button class="ai-close" type="button" (click)="onClose()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </header>

  <div class="ai-body">
    <div class="ai-hero">
      <div class="ai-orb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"></path>
        </svg>
      </div>
      <span class="ai-badge">Coming soon</span>
      <h3 class="ai-hero-title">Ask anything about your business</h3>
      <p class="ai-hero-text">
        NexCore AI will help you analyze sales, draft documents, surface insights and
        automate tasks across every module — all in plain language.
      </p>
    </div>

    <div class="ai-chips">
      <span class="ai-chip" *ngFor="let s of suggestions">{{ s }}</span>
    </div>
  </div>

  <footer class="ai-foot">
    <div class="ai-composer" aria-disabled="true">
      <input class="ai-input" type="text" placeholder="Ask NexCore AI…" disabled />
      <button class="ai-send" type="button" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </div>
    <p class="ai-foot-note">We’re putting the finishing touches on it. Stay tuned ✨</p>
  </footer>
</aside>
