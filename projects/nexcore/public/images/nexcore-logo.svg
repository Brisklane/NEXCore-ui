<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 410" fill="none">
  <defs>
    <linearGradient id="nlMark" x1="130" y1="40" x2="320" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="0.55" stop-color="#22b6e6"/>
      <stop offset="1" stop-color="#2fd6c3"/>
    </linearGradient>
    <linearGradient id="nlText" x1="60" y1="0" x2="392" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33d4c6"/>
      <stop offset="0.5" stop-color="#22b6e6"/>
      <stop offset="1" stop-color="#2b7fff"/>
    </linearGradient>
  </defs>

  <!-- Mark (hexagon network) -->
  <g transform="translate(115 22) scale(1.75)" fill="none">
