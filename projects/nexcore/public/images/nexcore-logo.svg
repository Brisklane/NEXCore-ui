    <path d="M16 86 L104 34" stroke="url(#nlMark)" stroke-width="8.5" stroke-linecap="round"/>
    <g fill="url(#nlMark)">
      <circle cx="60" cy="10" r="8.5"/>
      <circle cx="104" cy="34" r="8.5"/>
      <circle cx="104" cy="86" r="8.5"/>
      <circle cx="60" cy="110" r="8.5"/>
      <circle cx="16" cy="86" r="8.5"/>
      <circle cx="16" cy="34" r="8.5"/>
      <circle cx="60" cy="60" r="7.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="220" y="382" text-anchor="middle"
        font-family="'Segoe UI', 'Poppins', system-ui, Arial, sans-serif"
        font-size="92" letter-spacing="-2" fill="url(#nlText)">
    <tspan font-weight="800">NEX</tspan><tspan font-weight="500">Core</tspan>
  </text>
</svg>
